<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470">
<style>text{font-family:'Kaiti SC','STKaiti','KaiTi','楷体','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',serif;fill:#F4F1E8}.h{font-size:30px;font-weight:700;letter-spacing:4px}.k{font-size:26px;font-weight:700}.d{font-size:18px}.pt{font-size:18px;font-style:italic}.y{fill:#FFE38A}.p{fill:#FFB8A8}.b{fill:#A9D2FF}</style>
<rect width="600" height="470" rx="18" fill="#B98A5A"/>
<rect x="12" y="12" width="576" height="446" rx="10" fill="#2F5545" stroke="#264536" stroke-width="3"/>
<text class="h" x="300" y="68" text-anchor="middle">线段、射线、直线</text>
<g stroke="#F4F1E8" stroke-width="3.5" stroke-linecap="round" fill="#F4F1E8">
<line x1="124" y1="136" x2="250" y2="136"/><circle cx="124" cy="136" r="5.5" stroke="none"/><circle cx="250" cy="136" r="5.5" stroke="none"/>
<line x1="124" y1="226" x2="262" y2="226"/><circle cx="124" cy="226" r="5.5" stroke="none"/><circle cx="204" cy="226" r="4.5" stroke="none"/>
<line x1="110" y1="316" x2="262" y2="316"/><circle cx="150" cy="316" r="4.5" stroke="none"/><circle cx="224" cy="316" r="4.5" stroke="none"/>
</g>
<text class="pt" x="124" y="163" text-anchor="middle">A</text><text class="pt" x="250" y="163" text-anchor="middle">B</text>
<text class="pt" x="124" y="253" text-anchor="middle">A</text><text class="pt" x="204" y="253" text-anchor="middle">B</text>
<text class="pt" x="150" y="343" text-anchor="middle">A</text><text class="pt" x="224" y="343" text-anchor="middle">B</text>
<text class="k y" x="36" y="145">线段</text><text class="k p" x="36" y="235">射线</text><text class="k b" x="36" y="325">直线</text>
<text class="d" x="290" y="130">2 个端点　能量长度</text><text class="d y" x="290" y="158">有始有终　线段 AB</text>
<text class="d" x="290" y="220">1 个端点　不能量</text><text class="d p" x="290" y="248">有始无终　射线 AB（端点在前）</text>
<text class="d" x="290" y="310">没有端点　不能量</text><text class="d b" x="290" y="338">无始无终　直线 AB / 直线 l</text>
<line x1="36" y1="374" x2="564" y2="374" stroke="#F4F1E8" stroke-width="1.5" stroke-dasharray="8 8" opacity=".5"/>
<text class="d" x="36" y="410">相同点：都是直的</text>
<text class="d" x="36" y="440">关系：线段<tspan class="p">一端延长</tspan>是射线，<tspan class="b">两端延长</tspan>是直线</text>
</svg>
