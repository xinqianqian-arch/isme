<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" width="600" height="310">
<style>text{font-family:'PingFang SC','HarmonyOS Sans SC','MiSans','Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#2E3A59} .tag{font-size:19px;font-weight:700;fill:#fff}.pt{font-size:21px;font-weight:700;font-style:italic}.note{font-size:18px;fill:#5B6170}</style>
<defs>
<linearGradient id="r" gradientUnits="userSpaceOnUse" x1="340" y1="0" x2="590" y2="0"><stop offset="0" stop-color="#FF7B5C"/><stop offset="1" stop-color="#FF7B5C" stop-opacity="0"/></linearGradient>
<linearGradient id="l" gradientUnits="userSpaceOnUse" x1="370" y1="0" x2="130" y2="0"><stop offset="0" stop-color="#5B9DFF"/><stop offset="1" stop-color="#5B9DFF" stop-opacity="0"/></linearGradient>
</defs>
<rect width="600" height="310" rx="18" fill="#FFFBF5"/>
<rect x="16" y="56" width="96" height="36" rx="18" fill="#FF7B5C"/><text class="tag" x="64" y="81" text-anchor="middle">射线 AB</text>
<line x1="340" y1="74" x2="590" y2="74" stroke="url(#r)" stroke-width="4"/>
<line x1="170" y1="74" x2="340" y2="74" stroke="#2E3A59" stroke-width="4" stroke-linecap="round"/>
<circle cx="170" cy="74" r="8" fill="#E0603F"/><circle cx="340" cy="74" r="5.5" fill="#2E3A59"/>
<text class="pt" x="170" y="110" text-anchor="middle" style="fill:#E0603F">A</text><text class="pt" x="340" y="110" text-anchor="middle">B</text>
<text class="note" x="130" y="144">端点是 <tspan style="font-weight:700;fill:#E0603F">A</tspan>：从 A 出发，经过 B 一直延伸</text>
<rect x="16" y="196" width="96" height="36" rx="18" fill="#5B9DFF"/><text class="tag" x="64" y="221" text-anchor="middle">射线 BA</text>
<line x1="130" y1="214" x2="370" y2="214" stroke="url(#l)" stroke-width="4"/>
<line x1="370" y1="214" x2="540" y2="214" stroke="#2E3A59" stroke-width="4" stroke-linecap="round"/>
<circle cx="540" cy="214" r="8" fill="#3A7BE0"/><circle cx="370" cy="214" r="5.5" fill="#2E3A59"/>
<text class="pt" x="370" y="250" text-anchor="middle">A</text><text class="pt" x="540" y="250" text-anchor="middle" style="fill:#3A7BE0">B</text>
<text class="note" x="130" y="284">端点是 <tspan style="font-weight:700;fill:#3A7BE0">B</tspan>：方向相反，和上面不是同一条射线</text>
</svg>
