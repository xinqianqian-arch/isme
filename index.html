<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>十一课件 · 让数学课动起来</title>
<meta name="description" content="数学老师十一，用 AI 自研 1–6 年级数学课件：网页互动、3D 动画、课堂演示视频。">
<link rel="icon" href="assets/avatar.webp">
<style>
  :root {
    --bg: #FFF9EE;
    --sun: #FFC845;
    --coral: #FF7B5C;
    --mint: #3DC9A4;
    --sky: #5B9DFF;
    --grape: #8C7BFF;
    --ink: #2E3A59;
    --muted: #6B7590;
    --xhs: #FF2442;
    --card: #FFFFFF;
    --radius: 24px;
    --shadow: 0 10px 30px rgba(46, 58, 89, .10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; border: 0; }
  .wrap { width: min(1180px, 100% - 48px); margin: 0 auto; position: relative; }

  /* ---------- 第一屏：人物介绍 + 跟随鼠标的黏土贴纸 ---------- */
  .hero {
    position: relative; min-height: 92vh; overflow: hidden;
    display: grid; place-items: center; text-align: center;
    background:
      radial-gradient(circle at 15% 20%, #FFE9B0 0, transparent 36%),
      radial-gradient(circle at 85% 78%, #DDEBFF 0, transparent 40%),
      radial-gradient(circle at 80% 15%, #FFE1D6 0, transparent 30%),
      var(--bg);
  }
  .stickers { position: absolute; inset: 0; }
  .sticker {
    position: absolute; left: 0; top: 0; cursor: pointer; user-select: none; -webkit-user-drag: none;
    object-fit: contain; filter: drop-shadow(0 10px 12px rgba(46, 58, 89, .14));
    will-change: transform;
  }
  .intro { position: relative; z-index: 1; padding: 64px 0 80px; pointer-events: none; }
  .intro a, .intro .me { pointer-events: auto; }

  .me { position: relative; display: inline-block; margin-bottom: 22px; perspective: 600px; }
  .avatar {
    display: block; width: 132px; height: 132px; border-radius: 50%; object-fit: cover;
    border: 5px solid #fff; box-shadow: 0 0 0 5px var(--sun), 0 18px 40px rgba(255, 170, 60, .3);
    will-change: transform;
  }
  .bubble {
    position: absolute; left: calc(100% + 14px); top: 18px; white-space: nowrap; text-align: left;
    background: #fff; padding: 10px 16px; border-radius: 16px; font-weight: 700; box-shadow: var(--shadow);
    animation: wave-in .6s .3s ease both;
  }
  .bubble::before {
    content: ""; position: absolute; left: -8px; top: 18px;
    border: 8px solid transparent; border-left: 0; border-right-color: #fff;
  }
  .bubble small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; margin-top: 2px; }
  @keyframes wave-in { from { opacity: 0; transform: translateX(-10px) scale(.9); } }

  h1 { font-size: clamp(42px, 6.4vw, 76px); line-height: 1.15; letter-spacing: 1px; font-weight: 900; }
  h1 .hl { position: relative; display: inline-block; color: var(--coral); pointer-events: auto; }
  h1 .hl span { display: inline-block; }
  h1 .hl:hover span { animation: bounce .6s ease; }
  h1 .hl span:nth-child(2) { animation-delay: .08s !important; }
  h1 .hl span:nth-child(3) { animation-delay: .16s !important; }
  @keyframes bounce { 30% { transform: translateY(-14px) rotate(-6deg); } 60% { transform: translateY(2px); } }
  h1 .hl svg { position: absolute; left: 0; bottom: -10px; width: 100%; height: 16px; }
  .lead { margin-top: 24px; font-size: 18px; color: var(--muted); line-height: 1.75; }

  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 26px; }
  .chip {
    display: inline-flex; align-items: baseline; gap: 6px;
    padding: 8px 14px; border-radius: 999px; background: rgba(255, 255, 255, .9); box-shadow: var(--shadow);
    font-size: 14px; color: var(--muted);
  }
  .chip b { color: var(--ink); font-size: 16px; }

  .ctas { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 34px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 15px 28px; border-radius: 999px; font-weight: 700; font-size: 16px;
    transition: transform .2s, box-shadow .2s;
  }
  .btn:hover { transform: translateY(-3px); }
  .btn-xhs { background: var(--xhs); color: #fff; box-shadow: 0 10px 24px rgba(255, 36, 66, .3); }
  .btn-ghost { background: #fff; color: var(--ink); box-shadow: var(--shadow); }

  .scroll-hint {
    position: absolute; left: 50%; bottom: 18px; translate: -50% 0; z-index: 1; color: var(--muted); font-size: 13px;
    display: flex; flex-direction: column; align-items: center; gap: 4px; animation: hint 2.4s ease-in-out infinite;
  }
  @keyframes hint { 50% { transform: translateY(6px); } }

  /* ---------- 第二屏：1–6 年级课件 ---------- */
  .works { padding: 72px 0 40px; position: relative; }
  .sec-head { text-align: center; margin-bottom: 26px; }
  .sec-head h2 { font-size: clamp(28px, 4vw, 38px); font-weight: 900; }
  .sec-head p { color: var(--muted); margin-top: 10px; }
  .tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 30px; }
  .tabs button {
    padding: 9px 18px; border-radius: 999px; background: #fff; color: var(--muted); font-weight: 700; font-size: 15px;
    box-shadow: var(--shadow); transition: background .2s, color .2s, transform .2s; white-space: nowrap;
  }
  .tabs button:hover { transform: translateY(-2px); }
  .tabs button.on { background: var(--ink); color: #fff; }

  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px; }
  .work {
    background: var(--card); border-radius: var(--radius); padding: 10px; box-shadow: var(--shadow);
    transition: transform .3s, box-shadow .3s; display: block; animation: pop .45s ease both;
  }
  .work:nth-child(2) { animation-delay: .05s; }
  .work:nth-child(3) { animation-delay: .1s; }
  .work:nth-child(4) { animation-delay: .15s; }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.97); } }
  .work:nth-child(odd):hover { transform: translateY(-8px) rotate(-1.5deg); }
  .work:nth-child(even):hover { transform: translateY(-8px) rotate(1.5deg); }
  .work:hover { box-shadow: 0 22px 44px rgba(46, 58, 89, .16); }
  .work .pic { position: relative; aspect-ratio: 3 / 2; overflow: hidden; border-radius: 16px; background: var(--tint); }
  .work img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s; display: block; }
  .work:hover img { transform: scale(1.06); }
  .go {
    position: absolute; right: 10px; bottom: 10px; padding: 6px 12px; border-radius: 999px;
    background: rgba(255, 255, 255, .95); color: var(--xhs); font-size: 12px; font-weight: 700;
    opacity: 0; transform: translateY(6px); transition: opacity .3s, transform .3s;
  }
  .work:hover .go { opacity: 1; transform: none; }
  .work .info { display: flex; align-items: center; gap: 10px; padding: 12px 6px 4px; }
  .work .info div { flex: 1; min-width: 0; }
  .work h3 { font-size: 16px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .work .meta { margin-top: 4px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .work .arrow {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
    background: var(--tint); font-weight: 800; transition: transform .3s;
  }
  .work:hover .arrow { transform: rotate(-45deg); }
  .more { text-align: center; margin-top: 22px; color: var(--muted); font-size: 14px; }

  .shop {
    margin-top: 110px; border-radius: 32px; padding: 34px 40px 34px 250px; position: relative;
    display: flex; align-items: center; gap: 28px;
    box-shadow: 0 20px 50px rgba(255, 142, 114, .3);
  }
  .shop-bg {
    position: absolute; inset: 0; border-radius: inherit; overflow: hidden;
    background: linear-gradient(120deg, #FFD966 0%, #FFB86B 55%, #FF8E72 100%);
  }
  .shop-bg::before, .shop-bg::after {
    content: ""; position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .18);
  }
  .shop-bg::before { width: 220px; height: 220px; right: -60px; top: -90px; }
  .shop-bg::after { width: 140px; height: 140px; right: 180px; bottom: -80px; }
  .teacher {
    position: absolute; left: 34px; bottom: 0; height: 250px;
    filter: drop-shadow(0 8px 16px rgba(160, 80, 40, .2));
    transform-origin: 50% 100%; transition: transform .3s;
  }
  .shop:hover .teacher { transform: rotate(-2deg) scale(1.03); }
  .shop > div:not(.shop-bg) { position: relative; }
  .shop h3 { font-size: 24px; font-weight: 900; }
  .shop p { margin-top: 6px; opacity: .85; }
  .shop .btn { margin-left: auto; position: relative; z-index: 1; flex-shrink: 0; background: #fff; color: var(--xhs); }

  footer { text-align: center; color: #A3ABBF; font-size: 13px; padding: 36px 0 40px; }

  /* ---------- 手机 ---------- */
  @media (max-width: 960px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .shop { flex-direction: column; text-align: center; padding: 160px 24px 32px; margin-top: 150px; }
    .teacher { left: 50%; bottom: auto; top: -110px; height: 250px; translate: -50% 0; }
    .shop .btn { margin: 8px auto 0; }
  }
  @media (max-width: 640px) {
    .wrap { width: calc(100% - 32px); }
    .hero { min-height: 100svh; }
    .intro { padding: 112px 0 120px; }
    .avatar { width: 104px; height: 104px; }
    .bubble { position: static; display: inline-block; margin-top: 14px; }
    .bubble::before { left: 50%; top: -8px; translate: -50% 0; border: 8px solid transparent; border-top: 0; border-bottom-color: #fff; }
    .me { display: flex; flex-direction: column; align-items: center; }
    .lead { font-size: 16px; }
    .tabs { justify-content: flex-start; overflow-x: auto; padding: 4px 4px 12px; margin: 0 -16px 18px; padding-left: 16px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .grid { gap: 12px; }
    .work { padding: 6px; border-radius: 18px; }
    .work .pic { border-radius: 13px; }
    .work .info { padding: 8px 4px 2px; }
    .work h3 { font-size: 14px; }
    .work .meta { font-size: 12px; }
    .work .arrow { display: none; }
    .shop h3 { font-size: 20px; }
    .scroll-hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

      <h2>1–6 年级课件 🎨</h2>
      <p>北师大版同步 · 网页互动 + 课堂演示视频</p>

      <div>
        <h3>全套课件，在小红书薯店等你 🛒</h3>
        <p>小红书搜「十一课件」· 小红书号 834134750</p>
      </div>

    </div>
  </div>
  <footer>© 2026 十一课件 · 用 AI 认真备好每一节数学课</footer>

<script>
const XHS = 'https://www.xiaohongshu.com/user/profile/5e502cc200000000010010c6';
const note = (id, token) => `https://www.xiaohongshu.com/explore/${id}?xsec_token=${token}&xsec_source=pc_user`;
const TINT = { Y: '#FFE9A8', M: '#CFF3E2', S: '#D3E8FF', P: '#FFDCC4', L: '#E4DCFF' };

/* 课件列表：img 对应 assets/lessons/<img>.webp，没有单独笔记的跳小红书主页 */
const GRADES = ['一年级', '二年级', '三年级', '四年级', '五年级', '六年级'];
const LESSONS = [
  { g: 1, img: 'g1a', tint: 'Y', title: '数一数', meta: '一年级上册 · 快乐的家园' },
  { g: 1, img: 'g1b', tint: 'M', title: '比一比', meta: '一年级上册 · 比较' },
  { g: 1, img: 'g1c', tint: 'S', title: '认识图形', meta: '一年级上册 · 认识图形' },
  { g: 1, img: 'g1d', tint: 'P', title: '认识钟表', meta: '一年级上册 · 认识钟表' },
  { g: 2, img: 'g2a', tint: 'L', title: '小小商店', meta: '二年级上册 · 购物' },
  { g: 2, img: 'g2b', tint: 'Y', title: '乘法的初步认识', meta: '二年级上册 · 数一数与乘法' },
  { g: 2, img: 'g2c', tint: 'M', title: '课桌有多长', meta: '二年级上册 · 测量' },
  { g: 2, img: 'g2d', tint: 'S', title: '辨认方向', meta: '二年级下册 · 方向与位置' },
  { g: 3, img: 'g3a', tint: 'Y', title: '认识角', meta: '三年级上册 · 认识图形', href: note('6ae066800000000027020a11', 'ABmpiaSDULzOd-s3yvSIICpTw_tyAzPW0vIr0HiyEJFvA=') },
  { g: 3, img: 'g3b', tint: 'M', title: '观察物体 · 3D 教室', meta: '三年级上册 · 观察物体', href: note('6adefa38000000001500f608', 'AB9cELwsP4hJ206WfZ-wLlzQi53jFd05mVweOvlfJgCGg=') },
  { g: 3, img: 'g3c', tint: 'S', title: '用 SU7 讲数学', meta: '三年级上册 · 观察物体', href: note('6add7435000000002a038b0e', 'ABIIKfhrVxR8oapC4Zs22WiEa_HJKCNWk6DC_56Zul7KU=') },
  { g: 3, img: 'g3d', tint: 'L', title: '认识分数', meta: '三年级下册 · 认识分数' },
  { g: 4, img: 'g4a', tint: 'P', title: '导航给的时间准吗？', meta: '四年级上册 · 综合实践', href: note('6ad982090000000033009ef6', 'AB8LFX4dssjVGBCjewj4wLDRpWPWhyukMBJmKdzuB94I0=') },
  { g: 4, img: 'g4b', tint: 'L', title: '同学的生日', meta: '四年级上册 · 数据的表示和分析', href: note('6ad57df7000000001e0277e5', 'ABEGXaOn9sazcgri7tbo18I7Iu3ONqU1Cf61QjDDyhM7Q=') },
  { g: 4, img: 'g4c', tint: 'Y', title: '相遇问题', meta: '四年级上册 · 数量关系', href: note('6ad4304f000000002902ec05', 'ABk_6xH6dWq1rWXwXUL707xEhyWIvTe5TeKMz_EW9LmYQ=') },
  { g: 4, img: 'g4d', tint: 'S', title: '运算律与混合运算', meta: '四年级上册 · 总复习', href: note('6adaff5b0000000032020fc5', 'ABsLR07AaHS32wBs1xq8h8zNTTcfuA8U3SzW6l64R86Nk=') },
  { g: 5, img: 'g5a', tint: 'M', title: '轴对称和平移', meta: '五年级上册 · 轴对称和平移' },
  { g: 5, img: 'g5b', tint: 'Y', title: '平行四边形的面积', meta: '五年级上册 · 多边形的面积' },
  { g: 5, img: 'g5c', tint: 'S', title: '长方体的展开图', meta: '五年级下册 · 长方体（一）' },
  { g: 5, img: 'g5d', tint: 'L', title: '体积与容积', meta: '五年级下册 · 长方体（二）' },
  { g: 6, img: 'g6a', tint: 'P', title: '圆的认识', meta: '六年级上册 · 圆' },
  { g: 6, img: 'g6b', tint: 'M', title: '百分数', meta: '六年级上册 · 百分数' },
  { g: 6, img: 'g6c', tint: 'Y', title: '圆柱与圆锥', meta: '六年级下册 · 圆柱与圆锥' },
  { g: 6, img: 'g6d', tint: 'S', title: '扇形统计图', meta: '六年级上册 · 数据处理' }
];

/* ---------- 年级切换 ---------- */
const tabs = document.getElementById('tabs');
const grid = document.getElementById('grid');
function showGrade(g) {
  tabs.querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.g === g));
  grid.innerHTML = LESSONS.filter(l => l.g === g).map(l => `
    <a class="work" style="--tint:${TINT[l.tint]}" href="${l.href || XHS}" target="_blank" rel="noopener">
      <div class="pic"><img src="assets/lessons/${l.img}.webp" alt="${l.title}"><span class="go">去小红书看 ↗</span></div>
      <div class="info"><div><h3>${l.title}</h3><div class="meta">${l.meta}</div></div><span class="arrow">→</span></div>
    </a>`).join('');
}
tabs.innerHTML = GRADES.map((n, i) => `<button type="button" data-g="${i + 1}">${n}</button>`).join('');
tabs.addEventListener('click', e => { const b = e.target.closest('button'); if (b) showGrade(+b.dataset.g); });
showGrade(1);

/* ---------- 跟随鼠标、会弹跳的黏土贴纸 ---------- */
const STICKERS = ['n01', 'o08', 'o05', 'n09', 'o10', 'n02', 'n07', 'o03', 'o11', 'n03', 'o01', 'n12', 'o06', 'n10'];
/* 位置（百分比）和大小；中间留给人物介绍 */
const SLOTS = [
  [5, 12, 96], [16, 34, 78], [4, 56, 104], [15, 76, 84], [7, 90, 70],
  [92, 11, 90], [82, 30, 80], [93, 50, 104], [82, 72, 120], [92, 90, 74],
  [30, 8, 66], [68, 7, 72], [27, 92, 70], [72, 91, 66]
];
/* 手机：只放在上下两条边和左右边缘，不压正文 */
const SLOTS_SMALL = [
  [9, 5, 58], [33, 4, 44], [67, 5, 46], [91, 6, 58], [3, 34, 44], [97, 40, 44],
  [3, 66, 44], [97, 70, 42], [10, 95, 52], [37, 96, 42], [64, 95, 46], [90, 94, 54]
];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const hero = document.getElementById('hero');
const layer = document.getElementById('stickers');
const avatar = document.getElementById('avatar');
const mouse = { x: -9999, y: -9999, in: false };
let items = [];

function layout() {
  const w = hero.clientWidth, h = hero.clientHeight, small = w < 640;
  const slots = small ? SLOTS_SMALL : SLOTS;
  items.forEach((it, i) => {
    it.el.hidden = i >= slots.length;
    if (it.el.hidden) return;
    const [px, py, size] = slots[i];
    it.size = size * (small ? 1 : Math.min(1, w / 1300 + .15));
    it.el.style.width = it.el.style.height = it.size + 'px';
    it.hx = px / 100 * w - it.size / 2;
    it.hy = py / 100 * h - it.size / 2;
  });
}

function buildStickers() {
  const n = Math.min(STICKERS.length, SLOTS.length);
  for (let i = 0; i < n; i++) {
    const el = document.createElement('img');
    el.className = 'sticker';
    el.src = `assets/stickers/${STICKERS[i]}.webp`;
    el.alt = '';
    el.draggable = false;
    layer.appendChild(el);
    const it = { el, x: 0, y: 0, vx: 0, vy: 0, r: 0, vr: 0, s: 1, vs: 0, depth: .5 + Math.random(), phase: Math.random() * 6.28, cool: 0 };
    el.addEventListener('pointerdown', () => jump(it, 1.6));
    items.push(it);
  }
  layout();
}

function jump(it, k = 1) {
  if (it.cool > 0) return;
  it.vy -= 9 * k;
  it.vr += (Math.random() < .5 ? -1 : 1) * 9 * k;
  it.vs -= .12 * k;
  it.cool = 24;
}

const ava = { rx: 0, ry: 0, vx: 0, vy: 0 };
function frame(t) {
  const rect = hero.getBoundingClientRect();
  const mx = mouse.x - rect.left, my = mouse.y - rect.top;
  items.forEach(it => {
    if (it.el.hidden) return;
    const cx = it.hx + it.size / 2, cy = it.hy + it.size / 2;
    let tx = 0, ty = 0;
    if (mouse.in) {
      // 朝鼠标方向轻轻追过去
      tx = Math.max(-46, Math.min(46, (mx - cx) * .05 * it.depth));
      ty = Math.max(-46, Math.min(46, (my - cy) * .05 * it.depth));
      // 鼠标靠太近就被弹开并蹦一下
      const dx = cx + it.x - mx, dy = cy + it.y - my, d = Math.hypot(dx, dy), R = it.size * .9 + 50;
      if (d < R) {
        const f = (1 - d / R) * 70;
        tx += dx / (d || 1) * f; ty += dy / (d || 1) * f;
        jump(it, .7);
      }
    }
    it.vx = (it.vx + (tx - it.x) * .07) * .86;
    it.vy = (it.vy + (ty - it.y) * .07) * .86;
    it.x += it.vx; it.y += it.vy;
    it.vr = (it.vr + (it.vx * 1.2 - it.r) * .08) * .88;
    it.r += it.vr;
    it.vs = (it.vs + (1 - it.s) * .2) * .78;
    it.s += it.vs;
    if (it.cool > 0) it.cool--;
    const bob = Math.sin(t / 900 + it.phase) * 6;
    it.el.style.transform = `translate3d(${it.hx + it.x}px, ${it.hy + it.y + bob}px, 0) rotate(${it.r}deg) scale(${2 - it.s}, ${it.s})`;
  });

  // 头像朝鼠标微微转头
  const ar = avatar.getBoundingClientRect();
  const tx = mouse.in ? Math.max(-1, Math.min(1, (mouse.x - ar.left - ar.width / 2) / 400)) * 16 : 0;
  const ty = mouse.in ? Math.max(-1, Math.min(1, (mouse.y - ar.top - ar.height / 2) / 400)) * -16 : 0;
  ava.vx = (ava.vx + (tx - ava.ry) * .08) * .82; ava.ry += ava.vx;
  ava.vy = (ava.vy + (ty - ava.rx) * .08) * .82; ava.rx += ava.vy;
  avatar.style.transform = `rotateY(${ava.ry}deg) rotateX(${ava.rx}deg)`;

  if (heroVisible) requestAnimationFrame(frame); else running = false;
}

let heroVisible = true, running = false;
function start() { if (!running && !reduce) { running = true; requestAnimationFrame(frame); } }
addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.in = true; });
document.addEventListener('pointerleave', () => { mouse.in = false; });
addEventListener('resize', layout);
new IntersectionObserver(([e]) => { heroVisible = e.isIntersecting; if (heroVisible) start(); }).observe(hero);
document.getElementById('me').addEventListener('pointerdown', () => items.forEach((it, i) => setTimeout(() => jump(it, 1.2), i * 40)));

buildStickers();
if (reduce) items.forEach(it => { it.el.style.transform = `translate3d(${it.hx}px, ${it.hy}px, 0)`; });
start();
</script>
</body>
</html>
