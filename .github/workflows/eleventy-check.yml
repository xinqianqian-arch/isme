name: Eleventy Production SEO Build
on:
  push:
    branches:
      - feature/eleventy-content-seo
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Validate SEO outputs
        run: |
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/llms.txt
          test -f dist/llms-full.txt
          test -f dist/ai-index.json
          node -e "const r=require('./dist/build-report.json');if(r.volumes!==12||r.units<80||r.indexable<95)process.exit(1);console.log(r)"
      - name: Upload built website
        uses: actions/upload-artifact@v4
        with:
          name: 11edu-site-dist
          path: dist/
          retention-days: 14
