name: Eleventy build check
on:
  pull_request:
    paths:
      - 'src/**'
      - 'content/**'
      - 'public/**'
      - 'eleventy.config.js'
      - 'package.json'
      - '.github/workflows/eleventy-check.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: test -f dist/index.html && test -f dist/sitemap.xml && test -f dist/robots.txt
