# 11edu.cc 由 Cloudflare Worker「11ai」从 main 自动构建发布（见 docs/cloudflare-deployment.md）。
# 这个工作流只做构建检查和打包，不负责发布。
name: Website build checks (Cloudflare publishes)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install build dependencies
        run: |
          npm ci --include=dev --no-audit --no-fund
      - name: Check content format
        run: npm run check
      - name: Build and validate output
        run: npm run build
      - name: Save deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: 11edu-site-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
