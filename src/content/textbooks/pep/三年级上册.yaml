# 人教版小学数学 三年级上册 教材目录 → 网址 /textbooks/pep/grade-3/volume-1/
# 单元、课时的先后顺序决定网址编号（第 5 单元 → unit-05，第 1 课 → lesson-01），调整顺序会改变网址。
# 课时只录入已经核对过的；新的课时请按教材顺序往后加，不要插到前面。
# 重点/易错/活动：显示在单元页上的三段说明。参考：核对目录用的资料链接，不在网站上显示。
年级: 3
册: 上册
版本: 2024课标修订版
更新: 2026-11-05
参考: http://www.dzkbw.com/books/rjb/shuxue/xs3s_2025/
单元:
- 名称: 观察物体
  重点: 从前面、侧面、上面观察物体和简单的立体组合，认识长方体的面，体会立体图形与平面图形之间的联系。
  易错: 把观察者的左右和物体的左右混在一起；想象不出被挡住的那些面。
  活动: 用纸盒和小正方体从不同方向观察并画出看到的形状，再把长方体纸盒拆开，看看六个面怎样展开。
  课时: []
- 名称: 混合运算
  重点: 掌握含两级运算和小括号的运算顺序，会用综合算式表示两步计算的实际问题。
  易错: 不管运算级别一律从左往右算；不理解小括号改变运算顺序的作用。
  活动: 在购物、乘车情境中先分步列式，再合并成一个综合算式，比较两种写法。
  课时: []
- 名称: 毫米、分米和千米
  重点: 认识毫米、分米、千米，建立长度单位的量感，会进行简单换算，能根据情境选择合适的单位。
  易错: 选单位脱离实际（如“课桌长 1 千米”）；单位之间的进率记混。
  活动: 量硬币的厚度感受 1 毫米，在操场上走一走、估一估 1 千米有多远。
  课时: []
- 名称: 多位数乘一位数
  重点: 会口算、笔算两三位数乘一位数，理解每一步计算的道理，并能估算结果的范围。
  易错: 进位后忘记加上进上来的数；因数中间或末尾有 0 时漏乘或多写 0。
  活动: 用点子图和小棒说清算理，在购物情境中先估算再笔算验证。
  课时: []
- 名称: 线和角
  重点: 认识线段、射线、直线和两点间的距离，认识角以及直角、锐角、钝角，会用三角尺比较角的大小。
  易错: 读写射线时端点字母顺序写错；认为角的两条边画得越长，角就越大。
  活动: 用手电筒的光引出射线，用活动角和三角尺比一比、分一分角的大小。
  课时: [线段、射线、直线, 两点间的距离]
- 名称: 分数的初步认识
  重点: 借助平均分认识分数，会读写、比较简单的分数，能用分数描述生活中“部分与整体”的关系。
  易错: 没有平均分也用分数表示；整体不一样时直接比较分数的大小。
  活动: 折纸条、分月饼，强调“同一个整体平均分成几份”。
  课时: []
- 名称: 复习与关联
  重点: 梳理全册知识，找出知识之间的联系，例如观察物体与线和角、乘法与混合运算。
  易错: 只刷题、不整理，知识点之间连不起来。
  活动: 让学生自己画一张本学期的知识地图，并整理一份错题本。
  课时: []
