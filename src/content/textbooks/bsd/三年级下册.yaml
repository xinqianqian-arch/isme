# 北师大版小学数学 三年级下册 教材目录 → 网址 /textbooks/bsd/grade-3/volume-2/
# 单元、课时的先后顺序决定网址编号（第 4 单元 → unit-04，第 2 课 → lesson-02），调整顺序会改变网址。
# 重点/易错/活动：显示在单元页上的三段说明。参考：核对目录用的资料链接，不在网站上显示。
年级: 3
册: 下册
版本: 2024课标修订版
更新: '2026-10-29'
参考: http://www.dzkbw.com/books/bsd/shuxue/xs3x_2026/
单元:
- 名称: 整数乘法（一）
  重点: 掌握整数乘法的口算、估算和笔算，理解竖式中每一步表示的意义，用乘法解决购物、观众人数等实际问题。
  易错: 竖式中部分积数位没有对齐，因数中间或末尾有0时漏乘或多写0。
  活动: 从游乐园门票、饮品店购物等情境出发，先估算结果范围，再用点子图或竖式说明算理，最后比较怎样买最省钱。
  课时: [武术表演, 去游乐园, 神奇的0, 去奶奶家, 饮品店, 有多少名观众, 怎样买最省钱]
- 名称: 图形的运动（二）
  重点: 认识轴对称图形和对称轴，辨认平移与旋转现象，能在方格纸上画出简单图形平移后的位置。
  易错: 把对称的对应点与平移后的对应点混淆，数平移格数时数成两个图形之间的空格。
  活动: 剪纸、折纸找对称轴，在方格纸上移动图形，再综合运用平移、旋转和对称设计图案。
  课时: [轴对称（一）, 轴对称（二）, 平移与旋转, 能移回去吗, 小小设计师]
- 名称: 周长
  重点: 理解周长是封闭图形一周的长度，会测量和计算长方形、正方形的周长。
  易错: 把周长和面积混为一谈，计算长方形周长时只把长和宽相加一次。
  活动: 用绳子绕树叶、课本封面一周再拉直测量，比较周长相等但形状不同的图形。
  课时: [什么是周长, 长方形周长, 相等的周长]
- 名称: 整数除法（一）
  重点: 掌握整数除法笔算和估商，探索商不变规律，研究行程数量关系。
  易错: 试商后余数不符合要求，或单位换算后速度计算错误。
  活动: 利用购票和行程题，先估答案范围再笔算验算。
  课时: [分松果, 家庭阅读, 猴子的烦恼, 集邮, 算得对吗, 买新书, 讲故事]
- 名称: 动手做
  重点: 通过拆盒子、叠盒子等动手活动，观察立体图形的面、棱和展开后的形状，发展空间观念。
  易错: 只凭想象判断，不能把展开图上的面和盒子上的面一一对应。
  活动: 准备牙膏盒、纸巾盒，先拆开描出展开图，再按展开图重新折回盒子。
  课时: [拆盒子, 叠盒子]
- 名称: 关系与规律
  重点: 不急于计算，而是观察算式之间的关系，发现等式、数量变化和图形排列中的规律。
  易错: 遇到算式就先算结果，忽略数与数之间的变化关系。
  活动: 比一比两组算式“不计算也能判断大小”的理由，用节日装饰中的重复排列找规律并续画。
  课时: [不计算城堡, 相等城堡, 欢庆节日]
- 名称: 数据的整理与表示
  重点: 收集、分类并整理数据，从图表中获得结论。
  易错: 条形统计图的刻度与数量没有对应。
  活动: 用班级鞋码或身高资料制作简单统计表。
  课时: [小小鞋店, 小小护旗手, 抓得住吗]
