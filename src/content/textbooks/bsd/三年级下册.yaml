# 北师大版小学数学 三年级下册 教材目录 → 网址 /textbooks/bsd/grade-3/volume-2/
# 单元、课时的先后顺序决定网址编号（第 4 单元 → unit-04，第 2 课 → lesson-02），调整顺序会改变网址。
# 重点/易错/活动：显示在单元页上的三段说明。参考：核对目录用的资料链接，不在网站上显示。
年级: 3
册: 下册
版本: 2024课标修订版
更新: '2026-11-06'
参考: http://www.dzkbw.com/books/bsd/shuxue/xs3x_2026/
单元:
- 名称: 整数乘法（一）
  重点: 掌握两、三位数乘一位数的竖式计算（不进位、进位、乘数中间或末尾有0），理解竖式每一步的意义；会用连乘、以小估大和有序列举解决行程、购物、观众人数等实际问题。
  易错: 进位时忘加进位或先加后乘，把个位的积整个写下（如12×5写成510）；乘数中间或末尾有0时漏写0占位；连乘问题说不清每一步求的是什么，估算取整后写成等号。
  活动: 用点子图圈一圈、计数器拨一拨说明竖式算理，画线段图分析去奶奶家的行程，把看台分成几份估计观众人数，列表比较怎样买最省钱。
  课时: [武术表演, 去游乐园, 神奇的0, 去奶奶家, 饮品店, 有多少名观众, 怎样买最省钱]
- 名称: 图形的运动（二）
  重点: 认识轴对称图形和对称轴，会剪简单的轴对称图形；辨认平移和旋转，能在方格纸上说出平移的方向和格数，设计并记录平移路线；运用轴对称设计徽标。
  易错: 把看起来左右差不多、对折后却不能完全重合的图形当成轴对称图形（如课本里的小房子剪纸、音符）；补全轴对称图形时把另一半照抄而不是翻过来画；数平移格数时数成两个图形之间的空格，只说方向不说格数。
  活动: 剪纸、折纸找对称轴，对折剪孔猜展开图；拼图还原双人游戏，一人设计并记录路线、一人照记录操作；为校园艺术节设计轴对称徽标。
  课时: [轴对称（一）, 轴对称（二）, 平移和旋转, 能移回去吗, 小小设计师]
- 名称: 周长
  重点: 理解周长是图形一周的长度，会用绕绳、量边相加、沿边线数等方法求周长；掌握长方形、正方形周长的计算方法；体会形状不同的图形周长可能相等。
  易错: 把涂满的“面”或方格个数当成周长；长方形周长只算了“长＋宽”（半周）或漏写小括号；以为看起来大的图形周长就长。
  活动: 用绳子绕树叶、课本封面一周再拉直测量，给长方形菜园算篱笆长度（含靠墙），用同样长的绳子围出不同的长方形，在方格纸上画周长相等的图形并有序列举。
  课时: [什么是周长, 长方形周长, 相等的周长]
- 名称: 整数除法（一）
  重点: 经历用表格、计数器和竖式记录平均分的过程，掌握两、三位数除以一位数的笔算（含商中间或末尾有0、商是两位数），会估算商的范围、用乘法验算；理解连除、乘除混合运算的顺序，借助画图、列表解决两步乘除问题。
  易错: 上一位剩下的数忘了和下一位合起来；商中间或末尾漏写0，最高位不够商1时商的位置写错；有余数的验算忘了加余数；连除丢掉小括号，找不准先求什么。
  活动: 分松果时先用小棒、计数器分一分，再把分的过程写成竖式；当“小医生”用估算和乘法验算查错；用方格图、线段图分析买新书、讲故事中的两步问题。
  课时: [分松果, 家庭阅读, 猴子的烦恼, 集邮, 算得对吗, 买新书, 讲故事]
- 名称: 动手做
  重点: 通过拆盒子、叠盒子等动手活动，观察立体图形的面、棱和展开后的形状，发展空间观念。
  易错: 剪断了面或剪得太少铺不平；不能把展开图上的面和盒子上的面一一对应；以为6个面连在一起就一定能叠成盒子。
  活动: 按“每个面至少有一条边连着”的规则，把牙膏盒、纸巾盒沿棱剪开铺平，给面贴标签找对应的面和相对的面；再看展开图先想后折，判断能不能叠成长方体、正方体盒子。
  课时: [拆盒子, 叠盒子]
- 名称: 关系与规律
  重点: 不急于计算，先观察算式之间的关系：一个加数相同就比另一个加数，和相等时一个加数多几、另一个就少几；在节日彩旗中发现简单的周期规律，并用符号或分组表示。
  易错: 遇到算式就先算；两个加数都不同时判断错；12＋□＝○＋8这类题把谁大谁小弄反；推算第几个时一组找错，正好分完时说错颜色。
  活动: 在“不计算城堡”里不计算判断能否开门并说理由，在“相等城堡”里帮算式找好朋友、多写几组找规律，给彩旗每一组标序号推算第15、22面的颜色。
  课时: [不计算城堡, 相等城堡, 欢庆节日]
- 名称: 数据的整理与表示
  重点: 经历收集、整理、表示和分析数据的过程，学会在标有鞋号、身高刻度的线上用画“×”整理数据，能把全班数据汇总成统计表，并根据结果提建议、选方案、说发现。
  易错: 画“×”时漏画、重画或间隔不一；在每小格1厘米的刻度线上数错格；把鞋号、身高和人数混淆；没抓住不记0，汇总次数对不上。
  活动: 调查本班鞋号、睡眠时间和身高，用画“×”整理并挑选身高接近的护旗手；自制“反应速度尺”玩抓尺子游戏，把全班数据汇总成统计表找规律。
  课时: [小小鞋店, 小小护旗手, 抓得住吗]
