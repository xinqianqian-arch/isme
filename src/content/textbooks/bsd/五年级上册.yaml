# 北师大版小学数学 五年级上册 教材目录 → 网址 /textbooks/bsd/grade-5/volume-1/
# 单元、课时的先后顺序决定网址编号（第 4 单元 → unit-04，第 2 课 → lesson-02），调整顺序会改变网址。
# 重点/易错/活动：显示在单元页上的三段说明。参考：核对目录用的资料链接，不在网站上显示。
年级: 5
册: 上册
版本: 2024课标修订版
更新: '2026-10-29'
参考: http://www.dzkbw.com/books/bsd/shuxue/xs5s_2026/
单元:
- 名称: 小数的再认识和加减法
  重点: 理解小数与十进分数之间的联系，学习比较小数和按数位对齐进行加减运算。
  易错: 小数点没有对齐，误把小数位数多当作数值大。
  活动: 用价格标签、身高尺和数位表比较小数并进行估算验算。
  课时: [小数的再认识（一）, 小数的再认识（二）, 一起去买书, 比大小, 买菜, 称体重, 歌手大赛]
- 名称: 三角形的再认识
  重点: 通过量、剪、拼等活动探索三角形内角和与三边关系，并推广到多边形的内角和。
  易错: 凭“看起来”判断三条线段能否围成三角形，忽略任意两边之和大于第三边。
  活动: 剪下三角形的三个角拼成平角，用小棒尝试围三角形，记录能围成与不能围成的情况。
  课时: [探索三角形内角和, 探索三角形三边关系, 探索内角和的奥秘]
- 名称: 小数乘法
  重点: 理解小数乘法与整数乘法的联系，探索小数点移动和积的合理范围。
  易错: 小数乘法算完没有正确处理小数位数。
  活动: 从商品价格与长方形面积情境解释小数乘法意义。
  课时: [买文具, 街心广场, 包装, 蚕丝, 手拉手, 购物]
- 名称: 用字母表示（一）
  重点: 用字母表示数、数量关系和规律，体会字母表示的一般性，为学习方程做准备。
  易错: 把 a×a 写成 2a，或不理解字母可以表示任意一个数。
  活动: 从“几只青蛙几张嘴”的儿歌出发，让学生用字母写出数量关系，再验证规律是否对所有情况成立。
  课时: [青蛙歌, 回声测距离, 用字母表示数量关系, 用字母表示规律, 等式中的规律]
- 名称: 多边形的面积
  重点: 通过割补与转化推导平行四边形、三角形、梯形的面积公式，会求组合图形的面积，认识公顷和平方千米。
  易错: 把斜边当成高，或忘记三角形面积需要除以2。
  活动: 用可拆拼纸片转化为长方形，观察面积不变、底高对应。
  课时: [比较图形的面积, 认识底和高, 探索平行四边形面积, 探索三角形面积, 探索梯形面积, 组合图形的面积, 公顷、平方千米, 成长的脚印]
- 名称: 图形的位置与运动（一）
  重点: 用数对描述物体的位置，在方格纸上进行图形的平移、旋转和轴对称变换，并描述图形运动前后的位置关系。
  易错: 数对中列和行的顺序颠倒；平移时数错移动的格数。
  活动: 用教室座位练习数对，在方格纸上模拟阅兵方阵的移动，再设计图案。
  课时: [确定位置, 摆图案, 国庆阅兵, 可爱的小猫]
- 名称: 倍数与因数
  重点: 理解倍数、因数、质数与合数，发现2、3、5的倍数特征。
  易错: 把“倍数和因数”的关系脱离具体整数范围。
  活动: 用百数表涂色寻找规律，解释为什么某数满足整除条件。
  课时: [倍数与因数, 探索2，5的倍数特征, 探索3的倍数特征, 最大公因数和最小公倍数, 质数与合数, 寻找质数]
- 名称: 可能性
  重点: 通过随机试验认识确定事件与不确定事件，比较事件发生的可能性大小，讨论游戏规则是否公平。
  易错: 把一次结果当成长期必然发生的结论。
  活动: 设计公平的转盘或摸球规则，用统计结果讨论公正性。
  课时: [不确定性, 谁先走, 摸球游戏]
