# 北师大版小学数学 五年级上册 教材目录 → 网址 /textbooks/bsd/grade-5/volume-1/
# 单元、课时的先后顺序决定网址编号（第 4 单元 → unit-04，第 2 课 → lesson-02），调整顺序会改变网址。
# 重点/易错/活动：显示在单元页上的三段说明。参考：核对目录用的资料链接，不在网站上显示。
年级: 5
册: 上册
版本: 2024课标修订版
更新: '2026-11-07'
封面: https://media.11aike.com/textbooks/bsd/grade-5/volume-1/cover.webp
参考: http://www.dzkbw.com/books/bsd/shuxue/xs5s_2026/
单元:
- 名称: 小数的再认识和加减法
  重点: 借助元角分、米尺和面积图理解小数的意义、计数单位和小数的性质；体会余数可以换成 0.1、0.01 继续分；会比较小数大小，理解小数点对齐就是相同数位对齐，会计算小数加减法。
  易错: 93÷4 把余数直接写成 23.1；12 克写成 0.12 千克；误把小数位数多当作数值大；加减时末位对齐（4.3＋5.63 算成 6.06），10－8.79 把小数部分照抄。
  活动: 用购物小票、米尺和鸟蛋说小数的意义，用“1 元平均分给 4 人”体会继续分，在数位表和数轴上比较跳高、跳远成绩，在计数器上拨一拨解释加减法。
  课时: [小数的再认识（一）, 小数的再认识（二）, 一起去买书, 比大小, 买菜, 称体重, 歌手大赛]
- 名称: 三角形的再认识
  重点: 通过量、撕、拼、折探索三角形内角和是 180°；了解尺规作图，用尺规作三角形并探索任意两边之和大于第三边；把研究方法迁移到四边形，发现四边形内角和是 360°。
  易错: 认为两边之和等于第三边也能围成三角形；尺规作图时偷用刻度、圆规张开的大小变了；量角读错内外圈刻度；四边形从中间一点分成 4 个三角形，算成 720°。
  活动: 撕角拼平角、折角验证 180°；用尺规作等边、等腰三角形，改变第三条线段的长短，看两条弧能不能相交；连对角线把四边形分成两个三角形。
  课时: [探索三角形内角和, 了解尺规作图, 探索三角形三边关系, 探索内角和的奥秘]
- 名称: 小数乘法
  重点: 借助元角、涂格子和面积图理解小数乘法的意义和算理，会用竖式计算并确定积的小数点；探索积与乘数的大小关系，体会运算律在小数中仍然适用，会根据问题往大估或往小估。
  易错: 0.6×3 写成 0.18，0.3×0.2 写成 0.6；积的末尾有 0 时先去 0 再点小数点，位数不够忘了补 0；1.2×1.25 拆成 1×1＋0.2×0.25；估算一律四舍五入。
  活动: 用文具价钱和涂一涂数“几个 0.1”，在百格图上画出 0.3 m×0.2 m 的地砖，用“按套买、分开买”验证运算律，带 100 元模拟购物估算剩下的钱够不够。
  课时: [买文具, 街心广场, 包装, 蚕丝, 手拉手, 购物]
- 名称: 用字母表示（一）
  重点: 用字母和含有字母的式子表示数、数量关系和规律，会写 4a、a² 等简写；借助天平发现等式两边同时加减、乘除同一个数（除数不为 0），等式仍然成立。
  易错: 把 a×a 写成 2a；用同一个字母表示两个不同的量（a 只青蛙 a 条腿）；只验证一个例子就写规律；回声测距忘了声音要一去一回；等式只改一边。
  活动: 从“1 只青蛙 4 条腿”的儿歌出发辨析三种写法，用三角形摆 Y 形图案并圈一圈解释 3n，用天平操作发现等式中的规律。
  课时: [青蛙歌, 回声测距离, 用字母表示数量关系, 用字母表示规律, 等式中的规律]
- 名称: 多边形的面积
  重点: 用数方格、平移、分割移补比较图形面积，理解“出入相补”；认识底和高，把平行四边形、三角形、梯形转化成学过的图形推导面积公式；会求组合图形的面积，认识公顷、平方千米，会估计不规则图形的面积。
  易错: 把斜边当成高，底和高不对应；三角形、梯形面积忘记除以 2；组合图形把重叠部分算两次；平方米和公顷之间的进率记成 100。
  活动: 在方格纸上剪拼比较十个图形的面积，拉动长方形框架观察高和面积的变化，剪拼纸片推导面积公式，用方格纸估计自己脚印的面积。
  课时: [比较图形的面积, 认识底和高, 探索平行四边形面积, 探索三角形面积, 探索梯形面积, 组合图形的面积, 公顷、平方千米, 成长的脚印]
- 名称: 图形的位置与运动（一）
  重点: 用数对表示和确定位置；借助数对描述点和图形在方格纸上的平移，发现左右平移变第 1 个数、上下平移变第 2 个数；观察数对按规律变化时图形怎样变化。
  易错: 数对中列和行的顺序颠倒；平移时数两个图形中间的空格，或把方向和加减配反。
  活动: 用教室座位练习数对，用棋子摆“100”并描述同学的移动，在方格纸上平移“阅兵方队”，按数对规律画出放大或变胖的小猫。
  课时: [确定位置, 摆图案, 国庆阅兵, 可爱的小猫]
- 名称: 倍数与因数
  重点: 在非零自然数范围内认识倍数与因数，探索 2、5、3 的倍数特征，会找最大公因数和最小公倍数，认识质数与合数，用筛法找出 100 以内的质数。
  易错: 单说“36 是倍数”而不说清是谁的倍数；类推出“3 的倍数看个位”；把奇数当成质数、把 1 当成质数；筛质数时漏掉 49、77、91。
  活动: 用小正方形拼长方形找因数、认识质数，在百数表中圈 2、5、3 的倍数并说明道理，玩拍手游戏认识公倍数，用埃拉托色尼筛法找质数。
  课时: [倍数与因数, 探索2，5的倍数特征, 探索3的倍数特征, 最大公因数和最小公倍数, 质数与合数, 寻找质数]
- 名称: 可能性
  重点: 通过掷硬币、转转盘感受结果的不确定性，比较可能性的大小；判断并设计公平的游戏规则；根据试验数据推测哪种结果的可能性大。
  易错: 把“可能性大”当成“一定发生”，以为前几次的结果会影响下一次；只看结果有两种就认为游戏公平。
  活动: 掷硬币先猜后记、比较四个转盘，判断“谁先走”的规则是否公平并修改，摸球后汇总全班数据作推测。
  课时: [不确定性, 谁先走, 摸球游戏]
