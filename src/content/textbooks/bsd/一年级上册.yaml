# 北师大版小学数学 一年级上册 教材目录 → 网址 /textbooks/bsd/grade-1/volume-1/
# 单元、课时的先后顺序决定网址编号（第 4 单元 → unit-04，第 2 课 → lesson-02），调整顺序会改变网址。
# 重点/易错/活动：显示在单元页上的三段说明。参考：核对目录用的资料链接，不在网站上显示。
年级: 1
册: 上册
版本: 2024课标修订版
更新: '2026-10-29'
参考: https://www.dzkbw.org/book/5128.html
单元:
- 名称: 生活中的数
  重点: 从真实物品的数量出发建立数感，理解0到10的数、顺序、大小和一一对应。
  易错: 把物体大小当成数量多少，或数数时漏数、重复数。
  活动: 用玩具排队、数字卡片和配对游戏，让学生边摆边说“几个”“第几个”。
  课时: [走进美丽乡村, 玩具, 小猫钓鱼, 文具, 数鸡蛋, 快乐的午餐, 动物乐园]
- 名称: 5以内数加与减
  重点: 理解合起来用加法、去掉一部分用减法，能用图示和算式表达数量变化。
  易错: 只记算式不理解加减含义，把“还剩”误当作加法。
  活动: 让学生用两组圆片合并、拿走，再为同一情境口头解释式子。
  课时: [一共有多少, 还剩下多少, 可爱的小猫]
- 名称: 整理与分类
  重点: 尝试按颜色、形状和用途确定分类标准，比较不同分法得到的结果。
  易错: 分类时变换标准，造成重复计数或遗漏。
  活动: 让学生分类整理教具，再说出分类规则并检查是否不重不漏。
  课时: [整理房间, 一起来分类]
- 名称: 10以内数加与减
  重点: 把10以内的分解组合与加减运算联系起来，逐步形成口算策略和解决问题的能力。
  易错: 一图多式时不关注数量关系，连加连减时漏算步骤。
  活动: 利用十格框和数字卡，比较不同算法并制作属于学生自己的加减法表。
  课时: [猜数游戏, 背土豆, 课间, 小鸡吃食, 乘车, 挖红薯, 可爱的企鹅, 做个加法表, 做个减法表]
- 名称: 有趣的立体图形
  重点: 观察长方体、正方体、圆柱、球等立体图形的形状与特征，初步发展空间观念。
  易错: 把平面图形和立体图形混淆，认为只有正着摆放才能辨认形状。
  活动: 让学生摸一摸、滚一滚、搭一搭，并描述物体能否滚动和稳定堆叠的原因。
  课时: [认识图形, 我说你做, 怎样搭得高]
