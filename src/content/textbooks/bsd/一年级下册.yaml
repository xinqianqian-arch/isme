# 北师大版小学数学 一年级下册 教材目录 → 网址 /textbooks/bsd/grade-1/volume-2/
# 单元、课时的先后顺序决定网址编号（第 4 单元 → unit-04，第 2 课 → lesson-02），调整顺序会改变网址。
# 重点/易错/活动：显示在单元页上的三段说明。参考：核对目录用的资料链接，不在网站上显示。
年级: 1
册: 下册
版本: 2024课标修订版
更新: '2026-10-29'
参考: https://www.renjiaoshe.com/p/526422.html
单元:
- 名称: 20以内数与加法
  重点: 认识11至20的数及位值，学习十加几、进位加法和凑十策略。
  易错: 只数实物而没有形成“一个十和几个一”的十进位结构。
  活动: 用小棒捆十和十格框演示，从直观摆放逐步过渡到心算。
  课时: [古人计数（一）, 古人计数（二）, 搭积木, 开心农场, 一起做家务, 小兔子安家, 做个加法表]
- 名称: 图形大变身（一）
  重点: 通过描面、印面和观察影子，体验从立体物体中发现平面形状。
  易错: 误以为立体图形的面都一样，不能区分侧面和正面。
  活动: 用积木、印泥、纸片和光源做“从体到面”的观察活动。
  课时: [做一做, 找一找, 影子剧场]
- 名称: 20以内数与减法
  重点: 理解十几减几的退位减法，比较破十法和想加算减等不同思路。
  易错: 把被减数个位不够减时直接反过来相减。
  活动: 先摆十根一捆的小棒，再拆十、补差，引导学生解释为什么要退位。
  课时: [买文具, 捉迷藏, 凑数游戏, 开会啦, 跳伞表演, 美丽的田园, 做个减法表]
- 名称: 100以内数的认识
  重点: 建立十位与个位的数位意识，读写比较100以内的数并观察百数表规律。
  易错: 数位混淆，例如把“六十零三”写成603。
  活动: 用计数器、十捆小棒和百数表，研究相邻数与数位变化。
  课时: [身边的数, 数一数, 数豆子, 谁的红果多, 小小养殖场, 做个百数表]
- 名称: 100以内数加与减（一）
  重点: 借助整十数运算、口算和生活情境解决不进位不退位的简单加减问题。
  易错: 把十位数字和个位数字直接混加，忽略数位。
  活动: 展示小棒模型和数位表，讨论先算十位还是先算个位。
  课时: [小兔请客, 采松果, 青蛙吃虫子, 算一算, 有趣的算式, 回收废品]
- 名称: 有趣的平面图形（一）
  重点: 辨认长方形、正方形、三角形和圆，经历折、剪、拼、摆发展几何直观。
  易错: 对旋转后的图形辨识不稳，把“斜放”误当成另一种图形。
  活动: 用七巧板、彩纸和方格纸设计图案，说出每一块图形的特点。
  课时: [认识图形, 动手做（一）, 动手做（二）, 动手做（三）, 拼图大挑战]
