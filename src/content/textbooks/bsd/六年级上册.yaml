# 北师大版小学数学 六年级上册 教材目录 → 网址 /textbooks/bsd/grade-6/volume-1/
# 单元、课时的先后顺序决定网址编号（第 4 单元 → unit-04，第 2 课 → lesson-02），调整顺序会改变网址。
# 重点/易错/活动：显示在单元页上的三段说明。参考：核对目录用的资料链接，不在网站上显示。
年级: 6
册: 上册
版本: 2024课标修订版
更新: '2026-10-29'
参考: http://www.dzkbw.com/books/bsd/shuxue/xs6s_2026/
单元:
- 名称: 分数除法
  重点: 理解分数除法与乘法关系，会用倒数计算简单分数除法。
  易错: 只记“除以一个数等于乘倒数”而不能解释题意。
  活动: 用等分纸条或数轴表示分数除法，检验所得商是否合理。
  课时: [分数除法（一）, 分数除法（二）, 分数除法（三）]
- 名称: 圆
  重点: 理解圆心、半径、直径与圆的周长面积，感受圆周率的意义。
  易错: 计算圆周长与圆面积时混淆公式，半径和直径代入不分。
  活动: 用绳子测圆周，剪拼纸圆推导面积，比较数据寻找规律。
  课时: [车轮为什么是圆的, 圆的认识（一）, 圆的认识（二）, 修复铜镜, 欣赏与设计, 圆的周长, 圆周率的历史, 圆的面积（一）, 圆的面积（二）]
- 名称: 用字母表示（二）
  重点: 进一步用含有字母的式子表示数量关系和规律，会求含字母式子的值，在日历和图形周长中发现一般规律。
  易错: 找规律时只验证一两个例子就下结论；化简含字母的式子时把系数和字母混在一起算。
  活动: 在日历上框出几个数，探索它们之间的关系并用字母写出来；计算不同大小花坛的周长，归纳通用的式子。
  课时: [用字母表示数量关系, 探索规律（一）, 探索规律（二）, 日历中的数量关系, 花坛的周长]
- 名称: 分数的应用
  重点: 分析“求一个数的几分之几”“已知一个数的几分之几求这个数”等问题的数量关系，用线段图找准单位“1”。
  易错: 单位“1”找错，该用乘法时用了除法。
  活动: 先画线段图标出单位“1”和对应分率，再列式，对比乘法与除法题型的异同。
  课时: [分数的应用（一）, 分数的应用（二）, 分数的应用（三）]
- 名称: 比的认识
  重点: 理解比的意义、比值和比的基本性质，会化简比，并初步认识比例。
  易错: 把比与除法的关系理解成两个量相减。
  活动: 用果汁调配和地图比例构建具体比的模型。
  课时: [生活中的比（一）, 生活中的比（二）, 比的化简, 比例的认识]
- 名称: 确定位置
  重点: 用方向（角度）和距离描述物体的位置和行进路线，能在平面图上根据描述确定位置。
  易错: 只说方向不说距离，或把观测点（参照点）弄错。
  活动: 跟随“象群北迁”的路线图，用方向和距离描述象群每一段的行进路线。
  课时: [象群北迁（一）, 象群北迁（二）, 象群北迁（三）]
- 名称: 百分数的认识与应用（一）
  重点: 理解百分数的意义，会进行百分数与分数、小数的互化，解决合格率、营养成分、储蓄利息等实际问题。
  易错: 将百分数等同于具体数量，忽略对应的整体。
  活动: 读食品包装上的营养成分表和存款利率表，说清“百分之几”是谁的百分之几。
  课时: [百分数的认识, 合格率, 餐桌上的百分数, 储蓄中的百分数]
- 名称: 观察物体（二）
  重点: 认识投影现象，根据从不同方向看到的形状推断用小正方体搭成的立体图形。
  易错: 认为同一组视图只能对应一种搭法；分不清影子方向与光源位置的关系。
  活动: 用手电筒照积木观察影子的变化，根据三个方向的视图尝试搭出所有可能的立体图形。
  课时: [有趣的投影, 搭积木]
- 名称: 数据的表示和分析（三）
  重点: 认识扇形统计图，能根据数据特点和问题选择合适的统计图，分析数据中的比例关系和变化趋势。
  易错: 把扇形统计图各部分比例加总出错。
  活动: 用人口年龄结构数据讨论“适老社会”，对比条形、折线和扇形统计图各自适合表达什么。
  课时: [建设适老社会（一）, 建设适老社会（二）, 身高的情况, 身高的变化]
