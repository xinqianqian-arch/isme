# 北师大版小学数学 六年级上册 教材目录 → 网址 /textbooks/bsd/grade-6/volume-1/
# 单元、课时的先后顺序决定网址编号（第 4 单元 → unit-04，第 2 课 → lesson-02），调整顺序会改变网址。
# 重点/易错/活动：显示在单元页上的三段说明。参考：核对目录用的资料链接，不在网站上显示。
年级: 6
册: 上册
版本: 2024课标修订版
更新: '2026-11-07'
封面: https://media.11aike.com/textbooks/bsd/grade-6/volume-1/cover.webp
参考: http://www.dzkbw.com/books/bsd/shuxue/xs6s_2026/
单元:
- 名称: 分数除法
  重点: 借助分一分、涂一涂理解分数除法的意义，掌握“除以一个不为零的数等于乘它的倒数”，会解决“已知一个数的几分之几是多少，求这个数”的问题。
  易错: 被除数也取倒数，或在除法算式里直接约分；求单位“1”时看到“的”就用乘法。
  活动: 用涂色纸条、分饼和线段图解释分数除法，比较商与被除数的大小，并用乘法检验结果。
  课时: [分数除法（一）, 分数除法（二）, 分数除法（三）]
- 名称: 圆
  重点: 认识圆心、半径、直径和圆的对称性，会利用圆的特征找圆心、设计图案；探索并掌握圆的周长和面积公式，理解圆周率的意义。
  易错: 半径和直径代入不分，周长、面积的公式和单位混用；把直径说成圆的对称轴；以为直径变成 2 倍，面积也变成 2 倍。
  活动: 滚硬纸板车轮描中心的痕迹，折纸找圆心、修复铜镜残片，滚圆片、绕线测周长，把圆等分拼成近似平行四边形推导面积。
  课时: [车轮为什么是圆的, 圆的认识（一）, 圆的认识（二）, 修复铜镜, 欣赏与设计, 圆的周长, 圆周率的历史, 圆的面积（一）, 圆的面积（二）]
- 名称: 用字母表示（二）
  重点: 用含有两个字母的式子表示数量关系；用含有字母的式子表示并说明图形、日历中的规律，会代入求值，会用等式的性质由结果反推；用字母解决缺少数据的问题。
  易错: 两个不同的量用同一个字母（如 2a＋a）；连着摆图形时分不清 n 和 n－1；只验证一两个例子就下结论；2π(r＋1) 漏乘写成 2πr＋1。
  活动: 用篮球得分辨析 2a＋a 和 2a＋b，用小棒摆三角形、拼桌子写出 1＋2n、2n＋2，在日历上框数说明对角和相等，算出花坛外扩 1 m 小路后周长都增加 2π m。
  课时: [用字母表示数量关系, 探索规律（一）, 探索规律（二）, 日历中的数量关系, 花坛的周长]
- 名称: 分数的应用
  重点: 借助圆圈图、线段图分析“一个数的几分之几的几分之几”和“比一个数多（少）几分之几”的数量关系；分数混合运算顺序和整数相同，整数运算律在分数运算中同样适用。
  易错: 增加和减少几分之几时找错单位“1”（冰比水多 1/9，水比冰少 1/10）；除以分数时没改成乘倒数就约分。
  活动: 用“45 cm³ 的水结冰约 50 cm³”画两条线段比较 1/9 和 1/10，找出改错黑板上三道算式错在哪里。
  课时: [分数的应用（一）, 分数的应用（二）]
- 名称: 比的认识
  重点: 理解比的意义、比值以及比和分数、除法的关系，会化简比，初步认识比例。
  易错: 用两个量的差判断图片像不像；把比当成加减关系（两项各添 3 份）；前项后项写反；化简比和求比值混淆。
  活动: 量一量 A～E 五张图片的长和宽找出“像”的那几张，调颜料、调蜂蜜水，体会比相等时味道和颜色不变。
  课时: [生活中的比（一）, 生活中的比（二）, 比的化简, 比例的认识]
- 名称: 确定位置
  重点: 用方向（角度）和距离描述物体的位置和行进路线；换了观测点，位置要重新描述；体会方向距离、数对、经纬度等方法都要两个要素。
  易错: 只说方向不说距离；“北偏东”和“东偏北”说混；换了观测点后照抄原来的方向。
  活动: 跟随“象群北迁”的路线图，用方向和距离描述象群每一段的行进路线。
  课时: [象群北迁（一）, 象群北迁（二）, 象群北迁（三）]
- 名称: 百分数的认识与应用（一）
  重点: 理解百分数的意义；会求一个数是另一个数的百分之几、一个数的百分之几是多少；会进行百分数与小数、分数的互化；用年利率计算利息并比较存款方案。
  易错: 把百分数当成具体数量（如“75% 米”）；求百分率时被除数和除数颠倒；求利息忘乘存期。
  活动: 用罚点球成绩比较谁罚得好，读 1952 年和 2017 年餐桌的扇形统计图算每天的主食克数，按利率表比较几种存款方案。
  课时: [百分数的认识, 合格率, 餐桌上的百分数, 储蓄中的百分数]
- 名称: 观察物体（二）
  重点: 认识投影现象，根据从不同方向看到的形状推断用小正方体搭成的立体图形。
  易错: 把看到的形状当成投影；由一个投影只想到一种立体图形；从左面看时左右对应错；求最少、最多用几个小正方体时漏摆第一层。
  活动: 用手电筒照圆柱、圆锥观察投影，根据视图搭积木，求最少和最多用几个小正方体，揭开盖布复原模型。
  课时: [有趣的投影, 搭积木]
- 名称: 数据的表示和分析（三）
  重点: 围绕“建设适老社会”经历收集、整理、表示和分析数据的全过程；读懂扇形统计图，按问题选择统计图；用平均数和分段整理比较两组数据；读懂复式折线统计图并作合理估计。
  易错: 只用人数说明老龄化；把扇形图的百分比当成数量；两组人数不同还比总数；看点的高低而不是线段的陡缓判断增长快慢。
  活动: 读第五至七次人口普查数据，把同一组数据画成条形、折线、扇形三种统计图比一比，为订运动服把男女生身高按 5 cm 分段，画复式折线图估计三年后的身高。
  课时: [建设适老社会（一）, 建设适老社会（二）, 身高的情况, 身高的变化]
