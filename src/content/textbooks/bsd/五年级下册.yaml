# 北师大版小学数学 五年级下册 教材目录 → 网址 /textbooks/bsd/grade-5/volume-2/
# 单元、课时的先后顺序决定网址编号（第 4 单元 → unit-04，第 2 课 → lesson-02），调整顺序会改变网址。
# 重点/易错/活动：显示在单元页上的三段说明。参考：核对目录用的资料链接，不在网站上显示。
年级: 5
册: 下册
版本: 既有版目录
更新: '2026-10-29'
参考: https://www.taozhi.cn/phone_bmi/789
单元:
- 名称: 分数加减法
  重点: 理解同分母、异分母分数加减的计算依据，联系分数与小数。
  易错: 异分母直接把分子分母分别相加。
  活动: 用折纸和分数条统一分数单位，再写出通分计算。
  课时: [折纸, 星期日的安排, “分数王国”与“小数王国”]
- 名称: 长方体（一）
  重点: 认识长方体的面、棱、顶点和展开图，计算表面积。
  易错: 求表面积时遗漏被遮挡或只计算可见面。
  活动: 拆纸盒、折纸盒，判断哪些展开图能恢复立体。
  课时: [长方体的认识, 展开与折叠, 长方体的表面积, 露在外面的面]
- 名称: 分数乘法
  重点: 理解分数乘法意义并掌握计算，认识倒数。
  易错: 把分数乘法与分数加法的通分规则混淆。
  活动: 用涂色模型展示一个量的几分之几，再过渡到算式。
  课时: [分数乘法（一）, 分数乘法（二）, 分数乘法（三）, 倒数]
- 名称: 长方体（二）
  重点: 理解体积和容积，认识立方厘米、立方分米、立方米等单位并计算长方体体积。
  易错: 混淆面积单位与体积单位，单位换算时遗漏立方关系。
  活动: 用单位小方块堆出长方体，推导长×宽×高。
  课时: [体积与容积, 体积单位, 长方体的体积, 体积单位的换算, 有趣的测量]
- 名称: 分数除法
  重点: 理解分数除法与乘法关系，会用倒数计算简单分数除法。
  易错: 只记“除以一个数等于乘倒数”而不能解释题意。
  活动: 用等分纸条或数轴表示分数除法，检验所得商是否合理。
  课时: [分数除法（一）, 分数除法（二）, 分数除法（三）]
- 名称: 确定位置
  重点: 用方向、角度和距离共同描述物体位置。
  易错: 只给方向不说明距离或把参照点说错。
  活动: 在校园平面图上标注方向与角度，规划路线。
  课时: [确定位置（一）, 确定位置（二）]
- 名称: 用方程解决问题
  重点: 分析相等的数量关系，用方程解决实际问题。
  易错: 设未知数后数量关系没有保持等量。
  活动: 借助线段图描述邮票数量与相遇行程，再建立等式。
  课时: [邮票的张数, 相遇问题]
- 名称: 数据的表示和分析
  重点: 比较两组及以上数据的变化，认识复式统计图和平均数。
  易错: 只看图形的高低而忽略刻度与单位。
  活动: 用班级两组运动成绩设计统计图，讨论适合的图表。
  课时: [复式条形统计图, 复式折线统计图, 平均数的再认识]
