# 北师大版小学数学 二年级上册 教材目录 → 网址 /textbooks/bsd/grade-2/volume-1/
# 单元、课时的先后顺序决定网址编号（第 4 单元 → unit-04，第 2 课 → lesson-02），调整顺序会改变网址。
# 重点/易错/活动：显示在单元页上的三段说明。参考：核对目录用的资料链接，不在网站上显示。
年级: 2
册: 上册
版本: 2024课标修订版
更新: '2026-10-29'
参考: https://www.jyeoo.com/resource/tb/44/99271
单元:
- 名称: 100以内数加与减（二）
  重点: 借助两位数加减计算中的进位退位，学习竖式书写并联系生活解决问题。
  易错: 相同数位没有对齐，或加法进位、减法退位时漏写。
  活动: 用计数器和数位格对比口算、竖式，再结合购物和借阅情境验算。
  课时: [图书角, 摘苹果, 借阅图书, 收玉米, 跳绳, 套圈游戏]
- 名称: 测量（一）
  重点: 认识厘米和米，选择合适工具测量并培养估测能力。
  易错: 从尺子“1”刻度开始测量却直接把末端读数当长度。
  活动: 让学生先估再量，比较身体尺与刻度尺的结果。
  课时: [教室有多长, 课桌有多长, 1米有多长]
- 名称: 数一数与乘法
  重点: 把相同加数连加归纳成乘法，理解“几个几”与乘法算式的对应。
  易错: 把每组数量与组数交换时不能解释意义。
  活动: 用点阵图、座位方阵和实物分组建立乘法表象。
  课时: [小小清点员, 儿童乐园, 点子图中的乘法, 动物聚会, 快乐的动物]
- 名称: 乘法口诀（一）
  重点: 通过重复加法和规律探索掌握2至6的乘法口诀。
  易错: 口诀背得熟却无法判断题目中每组数量和组数。
  活动: 让学生结合车轮、手指和节奏活动编口诀、解释口诀。
  课时: [文物中的乘法口诀, 做家务, 需要几个轮子, 回家路上]
- 名称: 分一分与除法
  重点: 在等分、包含两种情境中理解除法，建立乘除之间的联系。
  易错: 误把“每份几个”和“分成几份”混为一谈。
  活动: 用圆片摆出两种分法，再用乘法口诀检查商。
  课时: [分物游戏, 分水果, 分糖果, 分香蕉, 小熊开店, 花园]
- 名称: 图形的运动（一）
  重点: 通过对折与平移认识轴对称，观察图形位置变化而形状不变。
  易错: 把整体转动误认为平移，对称轴画得不准确。
  活动: 用折纸、剪纸和方格棋移动图形，检验对应点是否重合。
  课时: [折一折，做一做, 好玩的华容道]
- 名称: 乘法口诀（二）
  重点: 掌握7、8、9相关口诀并利用口诀间规律提高计算效率。
  易错: 将相近口诀如7×8和8×9混淆。
  活动: 通过贴画阵列和乘法表找对称、倍数及相邻口诀的关系。
  课时: [有多少张贴画, 《西游记》中的乘法口诀, 有多少无人机, 能解决吗, 做个乘法表]
- 名称: 乘除法的应用（一）
  重点: 用乘法和除法处理倍数关系与分组问题，辨析求“几倍”和“几倍是多少”。
  易错: 见到“倍”字就做乘法，没有判断单位“1”。
  活动: 画条形图表达两种数量关系，再根据问题选择乘除法。
  课时: [长颈鹿与小鸟, 农家小院]
