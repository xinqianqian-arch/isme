参考: https://www.taozhi.cn/phone_bmi/60
单元:
- 名称: 小数的意义和加减法
  重点: 借助元角分、米尺和方格图理解小数的意义，认识小数的数位、计数单位和小数的性质，会比较小数大小；理解小数点对齐就是相同数位对齐，会计算小数加减法和加减混合运算。
  易错: 小数点没有对齐、按末尾对齐；整数减小数时把小数部分直接落下；误把小数位数多当作数值大；化简时去掉了小数中间的0。
  活动: 用价格标签、身高尺和数位表比较小数并进行估算验算。
  课时: [小数的意义（一）, 小数的意义（二）, 小数的意义（三）, 比大小, 买菜, 比身高, 歌手大赛]
- 名称: 认识三角形和四边形
  重点: 感受三角形的稳定性，按角、按边给三角形分类，探索三角形内角和及三边关系；按对边是否平行认识平行四边形和梯形，理解长方形、正方形、平行四边形之间的关系。
  易错: 只看到一个锐角就判断为锐角三角形；以为大三角形的内角和更大；把两边之和等于第三边也当成能围成三角形；斜放的梯形认不出。
  活动: 剪拼三角形角片，尝试制作不同三边长度的模型。
  课时: [图形分类, 三角形分类, 探索与发现：三角形内角和, 探索与发现：三角形边的关系, 四边形分类]
- 名称: 小数乘法
  重点: 理解小数乘法与整数乘法的联系，探索小数点移动引起小数大小变化的规律、积的小数位数和积与乘数的大小关系，体会运算律在小数中仍然适用。
  易错: 0.3×0.2算成0.6，没看清积里有几个0.01；积的位数不够忘了补0；先去掉末尾的0再点小数点；乘10时在小数末尾直接添0。
  活动: 从商品价格与长方形面积情境解释小数乘法意义。
  课时: [买文具, 小数点搬家, 街心广场, 包装, 蚕丝, 手拉手]
- 名称: 观察物体
  重点: 从正面、上面、左面观察小正方体搭成的立体图形，并根据三个方向看到的形状搭出立体图形。
  易错: 只根据一个方向的形状就动手搭，认为一种形状只能对应一种搭法；忽略前后重叠；左面、右面看到的图左右画反。
  活动: 用小正方体做搭建与猜测活动，比较多种可能。
  课时: [看一看, 我说你搭, 搭一搭]
- 名称: 认识方程
  重点: 用字母表示数和数量关系，找等量关系列方程，借助天平理解等式的性质（加减、乘除）并解简单方程。
  易错: 解方程时只在等号一边变形、加减或乘除方向用反，或把过程写成连等，忘了等式两边要同时变化；列等量关系时把“比……多/少”“是……的几倍”的方向写反。
  活动: 利用平衡天平与猜数游戏把未知量表示成等式。
  课时: [字母表示数, 等量关系, 方程, 解方程（一）, 解方程（二）, 猜数游戏]
- 名称: 数据的表示和分析
  重点: 经历调查、整理数据的过程，认识条形统计图（1格表示1个或多个单位）和折线统计图；理解平均数是一组数据平均水平的代表，会用移多补少、先合后分求平均数。
  易错: 把平均数当成数据中一定存在的某个值；读图时直接把格数当数量；把折线上“点最高”当成“增长最快”；求平均数时漏算了是0的那一项。
  活动: 调查全班同学生日所在的季节，涂格子画成条形统计图；栽蒜苗、量高度，选刻度画条形图，再描点连线画折线图；用移多补少求平均数。
  课时: [生日, 栽蒜苗（一）, 栽蒜苗（二）, 平均数]
