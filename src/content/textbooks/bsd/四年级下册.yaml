# 北师大版小学数学 四年级下册 教材目录 → 网址 /textbooks/bsd/grade-4/volume-2/
# 单元、课时的先后顺序决定网址编号（第 4 单元 → unit-04，第 2 课 → lesson-02），调整顺序会改变网址。
# 重点/易错/活动：显示在单元页上的三段说明。参考：核对目录用的资料链接，不在网站上显示。
年级: 4
册: 下册
版本: 既有版目录
更新: '2026-10-29'
参考: https://www.taozhi.cn/phone_bmi/60
单元:
- 名称: 小数的意义和加减法
  重点: 理解小数与十进分数之间的联系，学习比较小数和按数位对齐进行加减运算。
  易错: 小数点没有对齐，误把小数位数多当作数值大。
  活动: 用价格标签、身高尺和数位表比较小数并进行估算验算。
  课时: [小数的意义（一）, 小数的意义（二）, 小数的意义（三）, 比大小, 买菜, 比身高, 歌手大赛]
- 名称: 认识三角形和四边形
  重点: 辨认三角形类别、三角形内角和及三边关系，比较四边形特征。
  易错: 用视觉长短判断三角形是否能构成，忽略两边之和大于第三边。
  活动: 剪拼三角形角片，尝试制作不同三边长度的模型。
  课时: [图形分类, 三角形分类, 探索与发现：三角形内角和, 探索与发现：三角形边的关系, 四边形分类]
- 名称: 小数乘法
  重点: 理解小数乘法与整数乘法的联系，探索小数点移动和积的合理范围。
  易错: 小数乘法算完没有正确处理小数位数。
  活动: 从商品价格与长方形面积情境解释小数乘法意义。
  课时: [买文具, 小数点搬家, 街心广场, 包装, 蚕丝, 手拉手]
- 名称: 观察物体
  重点: 从多个方向观察组合立体图形，并根据视图推测原来形状。
  易错: 认为同一个视图只能对应一种立体搭法。
  活动: 用小正方体做搭建与猜测活动，比较多种可能。
  课时: [看一看, 我说你搭, 搭一搭]
- 名称: 认识方程
  重点: 用字母描述数量关系，理解方程和等式性质并解简单方程。
  易错: 移项时只记口诀而不理解等式两边保持相等。
  活动: 利用平衡天平与猜数游戏把未知量表示成等式。
  课时: [字母表示数, 等量关系, 方程, 解方程（一）, 解方程（二）, 猜数游戏]
- 名称: 数据的表示和分析
  重点: 学习统计表、条形或折线统计图的表达方式，理解平均数反映总体水平。
  易错: 把平均数理解为数据中一定存在的某个值。
  活动: 记录一段时间的植物生长数据，制作图表并解读趋势。
  课时: [生日, 栽蒜苗（一）, 栽蒜苗（二）, 平均数]
