# 北师大版小学数学 二年级下册 教材目录 → 网址 /textbooks/bsd/grade-2/volume-2/
# 单元、课时的先后顺序决定网址编号（第 4 单元 → unit-04，第 2 课 → lesson-02），调整顺序会改变网址。
# 重点/易错/活动：显示在单元页上的三段说明。参考：核对目录用的资料链接，不在网站上显示。
年级: 2
册: 下册
版本: 2024课标修订版
更新: '2026-10-29'
参考: https://www.yuntaigo.com/book.action?recordid=bm1tbGtub2M5Nzg3NTQyMzYzNTY1
单元:
- 名称: 100以内数加与减（三）
  重点: 在连续加减和加减混合问题中理解运算步骤，培养估算与验算习惯。
  易错: 列竖式时漏写进位退位，计算后不检查合理性。
  活动: 用行程和人数变化记录表展示连续变化，口头解释每一步算式。
  课时: [谁的得分高, 去军营, 星星合唱队]
- 名称: 图形大变身（二）
  重点: 探索长方体、正方体、圆柱和球之间的联系，结合折叠和展开观察面与体。
  易错: 只根据物体放置方向判断形状，忽略面与体的对应。
  活动: 折纸盒、拆纸盒、描各个面，比较展开图与立体物体。
  课时: [校园一角, 小蜗牛慢慢爬, 蜗牛的家]
- 名称: 除法的应用
  重点: 理解余数的含义，学习有余数除法与竖式，利用“余数小于除数”检验结果。
  易错: 余数不小于除数或在“至少需要几组”问题里忽略剩余。
  活动: 用装袋、租船等情境实际分一分，比较“分完”和“还剩”的结论。
  课时: [搭一搭（一）, 搭一搭（二）, 分松果, 租船]
- 名称: 生活中的大数
  重点: 认识千、万以内的数与数位顺序，学习读写比较并感受较大数量。
  易错: 把数中间的零漏读漏写或比较大小只看某一位。
  活动: 在计数器上逐位拨珠，结合学校人数与距离理解量级。
  课时: [福建土楼, 数一数（一）, 数一数（二）, 数说西藏, 哪座山更高, 有多少个字, 有多厚]
- 名称: 有趣的平面图形（二）
  重点: 认识平行四边形的特征，用七巧板和拼摆活动发展对图形变化的认识。
  易错: 只按外观的“歪斜”判断是否为平行四边形。
  活动: 用活动平行四边形和七巧板拼图比较边、角的特征。
  课时: [图形王国, 动手做（一）, 动手做（二）, 百变七巧板]
- 名称: 大数加与减（一）
  重点: 学习万以内数加减和口算策略，利用位值模型解释进位与退位。
  易错: 多位数连续退位时遗漏向高位借位的步骤。
  活动: 用数位表和购物账本演示拆分、凑整与笔算验算。
  课时: [鱼菜共生, 保护野生鸟类, 保护野生哺乳动物, 美丽滇池, 算得对吗, 有多远]
- 名称: 分类
  重点: 按不同标准进行逐层分类与记录，用简单统计表表达调查结果。
  易错: 中途改变分类标准，导致一项记录被计数两次。
  活动: 统计班级文具或运动爱好，学生自主定标准并交流分类依据。
  课时: [怎样分组, 水上乐园, 分扣子]
