# 重点：显示在全册目录的单元标题下；易错/活动：在“单元要点”里。参考：核对目录用的资料链接，不在网站上显示。
年级: 4
册: 上册
版本: 2024课标修订版
更新: '2026-11-07'
封面: https://media.11aike.com/textbooks/bsd/grade-4/volume-1/cover.webp
参考: http://www.dzkbw.com/books/bsd/shuxue/xs4s_2026/
单元:
- 名称: 认识更大的数
  重点: 认识十万、百万、千万、亿等计数单位和十进制数位顺序表，体会十万、一亿有多大；会读写、比较大数，会改写成以“万”“亿”为单位的数，会用四舍五入求近似数，认识自然数和十进制计数法。
  易错: 分级时从左往右分；数中间、末尾有0时读写出错（漏写占位0、把末尾的0读出来）；比较大小只看最高位数字；改写时0去多了或丢了“万”字；四舍五入看错数位。
  活动: 用人口普查、大豆产量的数据填数位顺序表并读写、排序，把报道里的“约多少万”放回数轴找位置，比较结绳、算筹和今天的写法，体会十进制和0的作用。
  课时: [数说祖国, 十万有多大, 认识更大的数, 人口普查, 大豆产量, 国庆庆典, 从结绳计数说起]
- 名称: 线与角
  重点: 认识线段、射线、直线，知道两点之间线段最短；借助相交认识垂直、借助平移认识平行，会画垂线和平行线；认识平角、周角和角的度量单位1°，会用量角器量角、画角。
  易错: 把“垂直”当成“竖直”，只认横平竖直的十字；只认一样长、对齐的线是平行；把平角当直线、周角当射线；量角器内外圈读反；认为角的边越长角越大。
  活动: 比较老虎山到狐狸洞的几条路，做“机灵狗去河边”的纸条实验，在方格纸上平移铅笔画平行线，用折扇演示平角和周角，用量角器、三角板量角、画角。
  课时: [线的认识, 相交与垂直, 平移与平行, 旋转与角, 角的度量（一）, 角的度量（二）]
- 名称: 整数乘法（二）
  重点: 掌握整十数乘整十数的口算和积的变化规律，借助点子图、表格理解两位数乘两位数的算理，掌握两、三位数乘两位数的笔算和估算；认识计算器并探索有趣的算式，能根据问题选择往大估或往小估。
  易错: 第二层积没有和十位对齐；乘数中间有0时，0乘得0后忘加进位；口算时漏添或多添0；判断“够不够”时估的方向选错。
  活动: 用点子图圈一圈、表格分一分说清14×12的算理，用计算器探索11×11、99×99等算式的规律，用电影院的座位和票价估一估够不够。
  课时: [找规律, 队列表演（一）, 队列表演（二）, 卫星运行时间, 神奇的计算工具, 有趣的算式, 电影院]
- 名称: 我们生活的空间（二）
  重点: 从不同位置观察同一场景，体会观察位置、方向与看到的范围和样子之间的关系，能根据照片推断拍摄位置。
  易错: 只看物体本身，忽略观察者站的位置；画视线没有经过挡住视线的顶端，或画到障碍物就停、不延长；判断拍摄位置时不看前后遮挡和左右顺序。
  活动: 用水杯和玩具车模拟司机看楼，画视线找出看不到的区域；把天安门广场的照片和拍摄位置对应，用书和保温杯模拟验证，再按位置给照片排序。
  课时: [观察的范围, 天安门广场]
- 名称: 运算律
  重点: 整理四则混合运算顺序并认识中括号；经历观察、猜想、验证、解释、概括的过程，发现加法交换律和结合律、乘法交换律、结合律和分配律，用字母表示，并会用运算律使计算简便。
  易错: 只有乘除（或只有加减）时挑着先算能凑整的部分；中括号去得太早；分不清交换律和结合律；乘法分配律漏乘，或和结合律混用；误以为c÷(a＋b)＝c÷a＋c÷b。
  活动: 给9÷3×5−2＝1添括号体会中括号的必要性；用方阵、贴瓷砖的两种算法解释交换律和分配律；用“括号搬家”和找凑整的好朋友体会结合律。
  课时: [生态养殖, 加法交换律和乘法交换律, 加法结合律, 乘法结合律, 乘法分配律]
- 名称: 图形的奥秘
  重点: 通过切、搭、翻滚等操作，观察立体图形的截面、组合与位置变化，发展空间想象能力。
  易错: 圆锥竖着切一律说成三角形（只有经过尖顶才是）；按图纸搭建时漏掉被挡住的正方体、图纸前后方向对不上；翻滚时数错间隔，把“隔3个面”算成每次加3。
  活动: 在圆柱形杯子里装水，立着、躺着、斜着观察水面形状验证截面；用小正方体按分层图纸搭大楼、看大楼画图纸；在数带上翻滚正方体，记录某个面经过的数。
  课时: [切开立体图形, 搭建立体大楼, 翻滚正方体]
- 名称: 运用数量关系解决问题
  重点: 体会总量与分量是相对的、减法是加法的逆运算；理解单价、数量、总价和速度、时间、路程的关系，会画线段图分析数量关系，并解决相遇问题。
  易错: 只背公式，分不清题中哪个量是单价、哪个量是总价；比较速度不看单位；相遇问题中只用一个人的速度去除总路程，或把两人各自的时间相加。
  活动: 用购物小票和两人相向而行的模拟活动，把数量关系画成线段图后再列式。
  课时: [总量与分量, 单价、数量与总价, 速度、时间与路程, 相遇问题]
- 名称: 数据的表示和分析（一）
  重点: 收集和整理身边的数据，会把数据分段整理，认识条形统计图，理解1格可以表示多个单位，并根据数据进行简单分析和判断。
  易错: 条形统计图一格代表多少没看清，读数时直接数格子；分段计数时边界上的数放错段。
  活动: 调查全班同学生日所在的季节，涂格子画成条形统计图；把国家自然科学奖获奖者的年龄分段整理后画图，说说发现。
  课时: [同学的生日, 获奖时的年龄]
