# 北师大版小学数学 四年级上册 教材目录 → 网址 /textbooks/bsd/grade-4/volume-1/
# 单元、课时的先后顺序决定网址编号（第 4 单元 → unit-04，第 2 课 → lesson-02），调整顺序会改变网址。
# 重点/易错/活动：显示在单元页上的三段说明。参考：核对目录用的资料链接，不在网站上显示。
年级: 4
册: 上册
版本: 2024课标修订版
更新: '2026-10-29'
参考: http://www.dzkbw.com/books/bsd/shuxue/xs4s_2026/
单元:
- 名称: 认识更大的数
  重点: 认识万以上整数和位值结构，学习读写、比较、改写与近似数。
  易错: 大数分级不准确，数位为0时读写出错。
  活动: 利用人口数据和土地面积绘制数位表，讨论精确数与近似数。
  课时: [数说祖国, 十万有多大, 认识更大的数, 人口普查, 大豆产量, 国庆庆典, 从结绳计数说起]
- 名称: 线与角
  重点: 辨认直线、射线、线段与平行垂直，使用量角器理解角的大小。
  易错: 量角器内外圈读错，认为线段延长后角也变大。
  活动: 用直尺、三角板和活动角测量教室中的角与线。
  课时: [线的认识, 相交与垂直, 平移与平行, 旋转与角, 角的度量（一）, 角的度量（二）]
- 名称: 整数乘法（二）
  重点: 学习两位数、三位数乘两位数的笔算与估算，理解部分积的来源，认识计算器并探索积的变化规律。
  易错: 多位数笔算时第二个部分积没有和十位对齐，因数中间有0时漏乘。
  活动: 用队列方阵的点子图拆分说明算理，再用计算器验证有趣算式中的规律。
  课时: [找规律, 队列表演（一）, 队列表演（二）, 卫星运行时间, 神奇的计算工具, 有趣的算式, 电影院]
- 名称: 我们生活的空间（二）
  重点: 从不同位置观察同一场景，体会观察位置、方向与看到的范围和样子之间的关系，能根据照片推断拍摄位置。
  易错: 只看物体本身，忽略观察者站的位置；不清楚换一个方向看时左右关系会发生变化。
  活动: 把天安门广场的照片和平面图对照，判断每张照片是从哪个位置拍的，再用积木和遮挡物体验观察的范围。
  课时: [观察的范围, 天安门广场]
- 名称: 运算律
  重点: 理解交换律、结合律和分配律，学习运算简便方法。
  易错: 将乘法分配律错用到除法或减法结构上。
  活动: 让学生用两种方法计算长方形阵列中的物品总数并讨论相等原因。
  课时: [生态养殖, 加法交换律和乘法交换律, 加法结合律, 乘法结合律, 乘法分配律]
- 名称: 图形的奥秘
  重点: 通过切、搭、翻滚等操作，观察立体图形的截面、组合与位置变化，发展空间想象能力。
  易错: 只凭想象判断截面形状或翻滚后的朝向，不动手验证。
  活动: 用橡皮泥或萝卜切一切看截面，用小正方体搭“大楼”，在方格纸上翻滚正方体记录每一面的朝向。
  课时: [切开立体图形, 搭建立体大楼, 翻滚正方体]
- 名称: 运用数量关系解决问题
  重点: 理解总量与分量、单价数量总价、速度时间路程等常见数量关系，会画线段图分析并解决实际问题。
  易错: 只背公式，分不清题中哪个量是单价、哪个量是总价；相遇问题中把两人速度和当成一个人的速度。
  活动: 用购物小票和两人相向而行的模拟活动，把数量关系画成线段图后再列式。
  课时: [总量与分量, 单价、数量与总价, 速度、时间与路程, 相遇问题]
- 名称: 数据的表示和分析（一）
  重点: 收集和整理身边的数据，选择合适的统计表或统计图表示，并根据数据进行简单分析和判断。
  易错: 条形统计图一格代表多少没看清，读数时直接数格子。
  活动: 统计全班同学的生日月份并画成统计图，讨论哪个月过生日的人最多。
  课时: [同学的生日, 获奖时的年龄]
