# 北师大版小学数学 三年级上册 教材目录 → 网址 /textbooks/bsd/grade-3/volume-1/
# 单元、课时的先后顺序决定网址编号（第 4 单元 → unit-04，第 2 课 → lesson-02），调整顺序会改变网址。
# 重点/易错/活动：显示在单元页上的三段说明。参考：核对目录用的资料链接，不在网站上显示。
年级: 3
册: 上册
版本: 2024课标修订版
更新: '2026-10-29'
参考: https://keben.szxuexiao.com/bsd3njsuxues2024.html
单元:
- 名称: 混合运算
  重点: 掌握含乘除与加减、含括号算式的计算顺序，用脱式计算表示解决问题的步骤。
  易错: 把“先乘除后加减”误写成从左到右，不理解小括号的必要性。
  活动: 从购物找零和乘船人数问题出发，先列数量关系，再讨论不同算式。
  课时: [小熊购物, 买文具, 过河]
- 名称: 测量（二）
  重点: 认识毫米、分米、千米和吨，建立量感并进行常见单位换算。
  易错: 把“1千米”和“1米”凭数字大小直接比较，脱离单位量级。
  活动: 让学生在教室估测、测量并设计校园路线长度记录。
  课时: [铅笔有多长, 1千米有多长, 旗杆有多高]
- 名称: 大数加与减（二）
  重点: 学习三位数等较大数的加减、连续进退位和验算，读懂里程数量关系。
  易错: 混淆里程表中的累计量与路段差量。
  活动: 绘制时间—路程表，用数位模型解释进退位并检查结果。
  课时: [捐书, 小小养殖场, 节余多少钱, 身高的增长, 里程表]
- 名称: 我们生活的空间（一）
  重点: 从不同方向观察立体物体，尝试根据视图搭出模型并说明可见与不可见部分。
  易错: 把观察方向和物体转动方向混淆。
  活动: 用积木搭结构，分别记录正面、侧面和上面看到的形状。
  课时: [看一看（一）, 看一看（二）, 看一看（三）, 看一看（四）]
- 名称: 认识图形
  重点: 认识角以及直角、锐角、钝角和常见四边形特征，建立形状的判别依据。
  易错: 认为角的两边越长角越大，忽略张口大小。
  活动: 利用活动角、纸片折角和方格图检验角的大小。
  课时: [认识角, 比一比, 认识直角, 长方形与正方形, 欣赏与设计]
- 名称: 乘除法的应用（二）
  重点: 在购物和分组情境中研究单价、数量、总价等关系，解决两步乘除应用题。
  易错: 把已知单价当成总价，忽略问题中的单位。
  活动: 用购物清单记录数量关系，画线段图后再列式验证。
  课时: [包饺子, 需要多少钱, 丰收了, 植树]
- 名称: 认识小数
  重点: 借助元角分和测量认识一位小数的读写、大小比较及简单加减法。
  易错: 将小数与整数的比较规则直接混用，例如看小数位数决定大小。
  活动: 用价格标签和身高尺建立0.1等于十分之一的具体感受。
  课时: [水果店, 量身高, 货比三家, 存零用钱, 竹子的生长, 生活中的小数]
- 名称: 调查与记录
  重点: 经历提出问题、收集数据、整理记录和解释结果的全过程。
  易错: 把统计表中的频数与总人数混淆，或遗漏未回答的人。
  活动: 组织“最喜欢的校园活动”调查，展示原始记录和统计结论。
  课时: [评选吉祥物, 购买水果]
