# 重点/易错/活动：显示在单元页上的三段说明。参考：核对目录用的资料链接，不在网站上显示。
年级: 6
册: 下册
版本: 既有版目录
更新: '2026-10-29'
参考: https://www.taozhi.cn/phone_bmi/790
单元:
- 名称: 圆柱与圆锥
  重点: 认识圆柱、圆锥的表面积和体积，理解旋转与空间图形的关系。
  易错: 求圆锥体积忘记乘三分之一或混淆侧面积与表面积。
  活动: 用圆柱和圆锥容器装沙，观察等底等高时的体积关系。
  课时: [面的旋转, 圆柱的表面积, 圆柱的体积, 圆锥的体积]
- 名称: 比例
  重点: 理解比例及其基本性质，学习比例尺并探索图形放缩。
  易错: 比例尺中的实际距离与图上距离单位不一致。
  活动: 绘制教室缩略平面图，从实际测量反推比例尺。
  课时: [比例的认识, 比例的应用, 比例尺, 图形的放大和缩小]
- 名称: 图形的运动
  重点: 综合使用平移、旋转、轴对称描述图形变化。
  易错: 确定旋转方向后忽略旋转中心和角度。
  活动: 用透明方格纸叠图，记录图形变换的顺序与对应点。
  课时: [图形的旋转（一）, 图形的旋转（二）, 图形的运动, 欣赏与设计]
- 名称: 正比例与反比例
  重点: 从变量变化和数据表认识正比例、反比例关系及其图像。
  易错: 只看两个量同时变化就判断成正比例，没有检查比值。
  活动: 用行驶时间与路程、固定路程下速度与时间的数据作图。
  课时: [变化的量, 正比例, 画一画, 反比例]
